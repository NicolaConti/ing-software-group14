<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa OpenLayers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol/dist/ol.css" type="text/css">
    <script src="https://cdn.jsdelivr.net/npm/ol/dist/ol.js"></script>
    <style>
        #map {
            width: 100%;
            height: 800px;
        }
        #modal, #commentModal {
            display: none;
            position: absolute;
            background-color: white;
            padding: 20px;
            border: 1px solid black;
            z-index: 1000;
        }
        #modal {
            top: 50px;
            left: 50px;
        }
        #commentModal {
            top: 150px;
            left: 150px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
<!-- Filter Dropdown -->
<label for="filterGravity">Filtra per Gravità:</label>
<select id="filterGravity" onchange="filterMarkers()">
    <option value="0">Tutti</option>
    <option value="1">1 - Bassa</option>
    <option value="2">2 - Moderata</option>
    <option value="3">3 - Alta</option>
    <option value="4">4 - Molto Alta</option>
    <option value="5">5 - Massima</option>
</select>

<div id="map" class="map"></div>

<div id="modal">
    <label for="tipo">Tipo di Segnalazione:</label>
    <select id="tipo">
        <option value="Problema Stradale">Problema Stradale</option>
        <option value="Rifiuti">Rifiuti</option>
        <option value="Incidente">Incidente</option>
        <option value="Altro">Altro</option>
    </select>
    <br>
    <label for="gravity">Gravità:</label>
    <select id="gravity">
        <option value="1">1 - Bassa</option>
        <option value="2">2 - Moderata</option>
        <option value="3">3 - Alta</option>
        <option value="4">4 - Molto Alta</option>
        <option value="5">5 - Massima</option>
    </select>
    <br>
    <label for="commento">Commento:</label>
    <textarea id="commento"></textarea>
    <br>
    <button onclick="aggiungiSegnalazione()">Aggiungi Segnalazione</button>
    <button onclick="chiudiModal()">Annulla</button>
</div>

<div id="commentModal">
    <div id="dettagliSegnalazione"></div>
    <div id="commenti"></div>
    <button onclick="chiudiCommentModal()">Chiudi</button>
</div>

<form id="login-form" action="/logout" method="post">
    <button type="submit">Logout</button>
</form>

<script>
    var map = new ol.Map({
        target: 'map',
        layers: [
            new ol.layer.Tile({
                source: new ol.source.OSM()
            })
        ],
        view: new ol.View({
            center: ol.proj.fromLonLat([11.12, 46.07]),
            zoom: 13
        })
    });

    var overlay = new ol.Overlay({
        element: document.getElementById('overlay')
    });
    map.addOverlay(overlay);

    var markerLayer = new ol.layer.Vector({
        source: new ol.source.Vector()
    });
    map.addLayer(markerLayer);

    var selectedMarker = null;

    function getMarkerScale(zoom) {
        return 0.05 + (zoom - 13) * 0.005;
    }

    function aggiungiSegnalazione() {
        var tipo = document.getElementById('tipo').value;
        var commento = document.getElementById('commento').value;
        var coordinate = overlay.getPosition();
        var gravity = parseInt(document.getElementById('gravity').value, 10);

        // Check if the user is authenticated
        fetch('/api/username')
            .then(response => {
                if (!response.ok) {
                    throw new Error('User not authenticated');
                }
                return response.json();
            })
            .then(data => {
                // User is authenticated, proceed with adding segnalazione
                fetch('/api/segnalazioni', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        tipo: tipo,
                        commento: commento,
                        coordinate: ol.proj.toLonLat(coordinate),
                        gravity: gravity
                    })
                })
                    .then(response => response.json())
                    .then(data => {
                        // Create and add the marker only after successful POST request
                        var marker = new ol.Feature({
                            geometry: new ol.geom.Point(coordinate),
                            tipo: tipo,
                            commento: commento,
                            idSegnalazione: data.id,
                            gravity: gravity // Ensure gravity is set
                        });

                        var zoom = map.getView().getZoom();
                        marker.setStyle(getMarkerStyle(zoom));
                        markerLayer.getSource().addFeature(marker);

                        document.getElementById('modal').style.display = 'none';
                        console.log('Segnalazione created:', data);
                    })
                    .catch(error => console.error('Errore:', error));
            })
            .catch(error => {
                console.error('Authentication error:', error);
                alert('You need to log in to create a segnalazione.');
            });
    }

    function chiudiModal() {
        document.getElementById('modal').style.display = 'none';
    }

    function chiudiCommentModal() {
        document.getElementById('commentModal').style.display = 'none';
    }

    function mostraSegnalazione(marker) {
        selectedMarker = marker;
        var coordinate = marker.getGeometry().getCoordinates();
        var tipo = marker.get('tipo');
        //var commento = marker.get('commento');
        var idSegnalazione = marker.get('idSegnalazione'); // Get idSegnalazione
        var gravity= marker.get('gravity');

        if (!idSegnalazione) {
            console.error('idSegnalazione is undefined');
            return;
        }

        var dettagli = `
        <p>Tipo: ${tipo}</p>
        <p>Gravity: ${gravity}</p>
        <p>Coordinate: ${ol.proj.toLonLat(coordinate)}</p>
    `;
        document.getElementById('dettagliSegnalazione').innerHTML = dettagli;

        document.getElementById('commenti').innerHTML = '';

        fetch(`/api/segnalazioni/${idSegnalazione}/feedbacks`)
            .then(response => response.json())
            .then(commenti => {
                var commentiDiv = document.getElementById('commenti');
                commenti.forEach(commento => {
                    var commentElement = document.createElement('p');
                    commentElement.textContent = commento;
                    commentiDiv.appendChild(commentElement);
                });
            })
            .catch(error => console.error('Errore:', error));

        document.getElementById('commentModal').style.display = 'block';

        document.getElementById('viewComments').onclick = function() {
            window.location.href = `/Feedback.html?reportId=${idSegnalazione}`;
        };
    }

    function loadMarkers() {
        console.log('Loading markers...');
        fetch('/api/segnalazioni')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch segnalazioni');
                }
                return response.json();
            })
            .then(data => {
                console.log('Fetched segnalazioni:', data);
                data.forEach(segnalazione => {
                    console.log('Adding segnalazione:', segnalazione);
                    var marker = new ol.Feature({
                        geometry: new ol.geom.Point(ol.proj.fromLonLat(segnalazione.coordinate)),
                        tipo: segnalazione.tipo,
                        commento: segnalazione.commento,
                        idSegnalazione: segnalazione.id, // Ensure idSegnalazione is set
                        gravity: segnalazione.gravity // Ensure gravity is set
                    });

                    var zoom = map.getView().getZoom();
                    marker.setStyle(getMarkerStyle(zoom));
                    markerLayer.getSource().addFeature(marker);
                });
            })
            .catch(error => {
                console.error('Errore:', error);
                alert('Failed to load segnalazioni.');
            });
    }

    function getMarkerStyle(zoom) {
        return new ol.style.Style({
            image: new ol.style.Icon({
                src: 'marker-icon.png',
                scale: getMarkerScale(zoom)
            })
        });
    }

    function filterMarkers() {
        var selectedGravity = parseInt(document.getElementById('filterGravity').value, 10);
        var source = markerLayer.getSource();

        source.getFeatures().forEach(function(feature) {
            var featureGravity = feature.get('gravity');
            if (selectedGravity === 0 || featureGravity === selectedGravity) {
                feature.setStyle(getMarkerStyle(map.getView().getZoom())); // Reset to default style
            } else {
                feature.setStyle(new ol.style.Style(null)); // Hide marker by setting an empty style
            }
        });
    }

    function updateMarkerScale() {
        var zoom = map.getView().getZoom();
        markerLayer.getSource().getFeatures().forEach(function(feature) {
            feature.setStyle(getMarkerStyle(zoom));
        });
    }

    map.on('singleclick', function(event) {
        var feature = map.forEachFeatureAtPixel(event.pixel, function(feature) {
            return feature;
        });

        if (feature) {
            mostraSegnalazione(feature);
        } else {
            var coordinate = event.coordinate;
            document.getElementById('modal').style.display = 'block';
            overlay.setPosition(coordinate);
        }
    });

    map.getView().on('change:resolution', updateMarkerScale);

    // Call filterMarkers initially to apply any default filter
    window.onload = function() {
        loadMarkers();
        filterMarkers();
    };
</script>
</body>
</html>
