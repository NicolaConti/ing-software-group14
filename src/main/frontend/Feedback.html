<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Feedback Segnalazione</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .feedback-section {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .feedback {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }
        .feedback:last-child {
            border-bottom: none;
        }
        .feedback-username {
            font-weight: bold;
        }
        .feedback-content {
            margin-top: 5px;
        }
        .add-feedback {
            margin-top: 20px;
        }
        .add-feedback input,
        .add-feedback button {
            padding: 10px;
            font-size: 16px;
            margin: 5px 0;
        }
        .add-feedback input {
            width: calc(100% - 22px);
        }
        .add-feedback button {
            width: 100%;
            background-color: #007bff;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        .add-feedback button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<h1>Feedback della Segnalazione</h1>
<div class="feedback-section" id="feedback-section">
    <!-- I feedback verranno caricati qui -->
</div>
<div class="add-feedback">
    <h2>Aggiungi un feedback</h2>
    <textarea id="feedback-input" placeholder="Scrivi il tuo feedback qui..." rows="4" cols="50"></textarea><br>
    <button onclick="submitFeedback()">Invia Feedback</button>
</div>

<script>
    let currentUser = null;
    let segnalazioneId = new URLSearchParams(window.location.search).get('id');

    // Funzione per caricare i feedback
    async function loadFeedbacks() {
        try {
            const response = await fetch(`/api/segnalazioni/${segnalazioneId}/feedbacks`);
            if (!response.ok) {
                throw new Error('Errore nel recupero dei feedback');
            }
            const feedbacks = await response.json();
            const feedbackSection = document.getElementById('feedback-section');
            feedbackSection.innerHTML = '';

            feedbacks.forEach(feedback => {
                const feedbackDiv = document.createElement('div');
                feedbackDiv.className = 'feedback';
                feedbackDiv.innerHTML = `
                        <div class="feedback-username">${feedback.username}</div>
                        <div class="feedback-content">${feedback.feedback}</div>
                    `;
                feedbackSection.appendChild(feedbackDiv);
            });
        } catch (error) {
            console.error('Errore:', error);
        }
    }

    // Funzione per inviare un nuovo feedback
    async function submitFeedback() {
        const feedbackInput = document.getElementById('feedback-input').value;

        if (!feedbackInput) {
            alert('Il feedback non può essere vuoto');
            return;
        }

        try {
            const response = await fetch(`/api/segnalazioni/${segnalazioneId}/feedbacks`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ feedback: feedbackInput, username: currentUser.username })
            });

            if (!response.ok) {
                throw new Error('Errore nell\'invio del feedback');
            }

            document.getElementById('feedback-input').value = '';
            loadFeedbacks();
        } catch (error) {
            console.error('Errore:', error);
        }
    }

    // Funzione per ottenere l'utente corrente
    async function getCurrentUser() {
        try {
            const response = await fetch('/api/currentUser');
            if (!response.ok) {
                throw new Error('Non autenticato');
            }
            currentUser = await response.json();
            loadFeedbacks();
        } catch (error) {
            console.error('Errore:', error);
            alert('Devi effettuare il login per visualizzare e aggiungere feedback');
            window.location.href = 'login.html';
        }
    }

    getCurrentUser();
</script>
</body>
</html>
